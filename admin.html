<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Redaksi — SUMBAREKSIS</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="./"><b>S</b><span>SUMBAREKSIS<small>REDAKSI / CMS</small></span></a><nav><a href="./">Lihat website ↗</a></nav></header><main class="admin">
<section id="login"><p class="eyebrow">AREA TERBATAS</p><h1>Login redaksi</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Masuk</button></form><p id="loginMsg"></p></section>
<section id="dash" class="hidden"><div class="dashhead"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Dashboard redaksi</h1><p id="stats"></p></div><button id="logout" class="secondary">Keluar</button></div>
<div class="admin-grid"><section class="panel"><h2 id="formTitle">Tulis berita</h2><form id="articleForm"><input id="id" type="hidden"><label>Judul<input id="title" maxlength="180" required></label><label>Ringkasan<textarea id="excerpt" maxlength="300" rows="3" required></textarea></label><div class="two"><label>Kategori<select id="category"><option>Nasional</option><option>Daerah</option><option>Politik</option><option>Bisnis</option><option>Teknologi</option><option>Olahraga</option><option>Gaya Hidup</option><option>Internasional</option></select></label><label>Penulis<input id="author" value="Redaksi SUMBAREKSIS" required></label></div><label>Foto utama (JPG/PNG/WebP, maks. 5 MB)<input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview hidden" alt="Pratinjau foto"><label>Isi berita<textarea id="body" rows="12" required></textarea></label><label>Status<select id="status"><option value="draft">Simpan sebagai draft</option><option value="published">Terbitkan sekarang</option></select></label><div class="actions"><button id="save">Simpan artikel</button><button id="cancel" type="button" class="secondary hidden">Batal edit</button></div><p id="formMsg"></p></form></section>
<section class="panel"><div class="listhead"><h2>Daftar artikel</h2><button id="refresh" class="secondary">Muat ulang</button></div><input id="filter" placeholder="Cari judul…"><div id="list"></div></section></div><p class="security">Hanya UID yang tercatat di koleksi <code>admins</code> dengan <code>enabled: true</code> dapat mengelola konten.</p></section></main><footer>SUMBAREKSIS • Sistem Redaksi</footer><script type="module" src="admin.js"></script></body></html>
